services:
  postgres:
    image: postgres:16
    container_name: replicahub-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: replicahub

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - replicahub_postgres_data:/var/lib/postgresql/data

volumes:
  replicahub_postgres_data: